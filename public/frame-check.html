<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WIMP mobile frame check</title>
<style>
  html,body{margin:0;background:#101418;color:#cfd8e2;font:13px system-ui,sans-serif}
  .wrap{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .frame{border:1px solid #2b3745;border-radius:8px;overflow:hidden;background:#000}
  iframe{display:block;border:0}
  p{margin:0 0 8px;color:#8592a2;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <p id="cap">mobile 390 × 844</p>
    <div class="frame"><iframe id="mobile" width="390" height="844" title="WIMP mobile"></iframe></div>
  </div>
</div>
<script>
  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') || 'ko';
  document.getElementById('mobile').src = './?lang=' + encodeURIComponent(lang);
  document.getElementById('cap').textContent = 'mobile 390 × 844 · ' + lang;
</script>
</body>
</html>
